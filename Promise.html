function abc(a, b) {
    return Promise.resolve(a + b);
}

var g = abc(10, 20);

console.log("g=", g);

var h = g.then(function(result) {
    console.log("result=", result);

    return "india"
});

console.log("g=", g);
console.log("h=", h);

// g= Promise {<fulfilled>: 30}

// g= Promise {<fulfilled>: 30}

// h= Promise {<fulfilled>: "hello"}



//     A Promise is not changed when you return another value from .then(); .then() creates and returns a new Promise containing that returned value.
