        <script>  
      

    function  getAllProducts()
    {
          var p = fetch("https://fakestoreapi.com/products")
          console.log(p) 
          p.then(function(r)
          {
            console.log(r)
            
            r.json().then(
                function(res){
                console.log(res)
            }
        )

          }
        
        )
          
          .catch(function(e){
            console.log(e)
          })
        
          return Promise.resolve(p)
          
    }
 

   
    getAllProducts().then(function(products){
        console.log(products)
    })
