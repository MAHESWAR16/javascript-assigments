     function div(nr, dr, cb) {
    if (dr === 0) {
        // If there is an error, pass it as the FIRST argument
        cb("Cannot divide by zero", null); 
    } else {
        var result = nr / dr;
        console.log("result =", result);
        // If success, pass null as the error, and the result as the SECOND argument
        cb(null, result); 
    }
}

// Call the function WITHOUT assigning it to a variable
div(0,1, function(err, res) {
    if (err) {
        console.log("error =", err); // Handle the error
    } else {
        console.log("result =", res); // Handle the success (even if res is 0)
    }
});
