<html>
    <head> 
        <style> 
          #d1 li img
          { 
            width:200px ;
            display: flex;
        
    
          }

        </style>

    </head>
    <body> 
        <ul id="d1"> 
            
        </ul>

        <script>
 
              fetch("https://fakestoreapi.com/products")

              .then(function(res){
                res.json().then(
                    function(data)
                    { 
                        console.log("data = ", data) 

                        data.forEach( 
                            function(a)
                            {
                                var nli = document.createElement("li")
                                nli.innerHTML = a.title 
                                var img = document.createElement("img")
                                img.src=a.image
                                var price = document.createElement("h1")
                                price.innerHTML = a.price
                                nli.appendChild(img)
                                nli.appendChild(price)
                                document.getElementById("d1").appendChild(nli)
                            }
                        )
                    }
                )
              })      

              .catch(
                function()
                {
                    console.log("sar sare le eno eno anukuntam ")
                }
              ) 

              console.log("last line")
         
       



        </script>

    </body>
</html>
