<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Promise Example</title>
  </head>
  <body>
    <script>

      function div(a, b) {
        var p = new Promise(
          function (resolve, reject)
           {
          setTimeout(
            function () 
            {
            if (b === 0) {
              reject('Denominator cannot be zero');
            } else {
              resolve(a / b);
            }
          }, 5000);
          
        });
        return p;
      }

      var x = div(12, 3);
      x.then(function (result) {
        console.log(result); // Should log 4
      }).catch(function (error) {
        console.log(error); // Will not be called in this case
      });

      var y = div(33, 0);
      y.then(function (result) {
        console.log(result); // Will not be called in this case
      }).catch(function (error) {
        console.log(error); // Should log "Denominator cannot be zero"
      });

      // Example for calling the div function and handling Promise with .then and .catch:
      // div(1123, 0).then(function (res) { console.log(res); }).catch(function (err) { console.log(err); });
      // div(1123, 20).then(function (res) { console.log(res); }).catch(function (err) { console.log(err); });
    </script>
  </body>
</html>
