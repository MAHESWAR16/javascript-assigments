<html> 
  <head> 
    <style> 

    </style>
  </head>
  <body> 
 

    
          <input type="text" placeholder="enter your name" id="d1"> <br>
          <input type="email" placeholder="enter your email" id="d2" >  <br>
          <input type = "number" id="d3"> <br>

          <button onclick="abc()">Submit</button>

        
 
          <table border="1px solid" >
            <thead > 
              <th>Sl No</th>
              <th>Name</th>
              <th>Email</th>
               <th>Number</th>
            </thead>

            <tbody id="d5">


            </tbody>
            


          </table>




          <script> 
               
               var slno = 0
                
                function abc()
                { 
                  
                  console.log(slno)
                  

                  var newtr = document.createElement("tr") 

                  var sltd = document.createElement("td")
                  slno++
                  sltd.innerHTML = slno
                  newtr.appendChild(sltd)

                  var nametd = document.createElement("td")
                  nametd.innerHTML = document.getElementById("d1").value
                  newtr.appendChild(nametd)

              
                  var emailtd = document.createElement("td") 
                  emailtd.innerHTML = document.getElementById("d2").value
                  newtr.appendChild(emailtd)
 

                  var numtd = document.createElement("td")
                  numtd.innerHTML = document.getElementById("d3").value
                  newtr.appendChild(numtd)

                  document.getElementById("d5").appendChild(newtr)

                }


                console.log(slno)
         </script>

    </body>
</html>
