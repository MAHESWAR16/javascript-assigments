<html> 
    <head> 
         <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
        <style> 
        .div
        {
            border:2px solid ;
            width: 250px;
            padding:6px;
            margin:5px ;
            box-sizing: border-box;
        } 
        </style>
    </head>
    <body>  
        <form onsubmit=bb(event)>
            <label>Full Name :</label>
            <input type="text" id="d1"/> <br><br>
            
            
            <!-- The Three Button Types
There are three possible values for type on a button:

Type	What it does
submit	(Default) Submits the form → reloads page or sends data to server
button	Does nothing on its own. Just sits there, waiting for JavaScript.
reset	Clears all inputs in the form back to their original values -->
        <button  onclick=choose() id="d4">Add Contact</button>
        </form>

         <i class="bi bi-sort-alpha-down"></i>&nbsp&nbsp&nbsp&nbsp&nbsp&nbsp&nbsp
         <input type="search" placeholder="Search a contact"/>
       

       
        <script> 
  
           function bb(e)
               {
                 e.preventDefault()
               }
 
               

             function choose()
             {
               if(document.getElementById("d4").innerHTML === "Add Contact")
                  {
                display_contacts()
                  } 
                   else 
                   {
                    save_contacts()
                   }
              }
          
               var Contacts = [] 

               var current_index = -1 
               var current_obj = null 
               var current_div = null

        
           
            // display contacts function call .
           function display_contacts()
           {
            var person_details ={
                                    fullname:"",
                                    number:'',
                                    email:''
                                 }  
                                  
                  person_details.fullname = document.getElementById("d1").value  
                                 Contacts.push(person_details) 
                                 console.log("array=",Contacts)   
                                  


                   var div =   document.createElement("div")
                   div.className ="div"
                   div.innerHTML ="FULL NAME:"+ person_details.fullname+"<br><br>"
                   document.body.appendChild(div) 
                   
                   // EDIT button creating
                   var button = document.createElement("button")
                   button.innerHTML ="EDIT" 
                   div.appendChild(button) 

                   //adding event listener to button
                   button.addEventListener("click",function(){

                    document.getElementById("d1").value = person_details.fullname 
                     
                    current_obj = person_details 

                    current_index = Contacts.indexOf(current_obj) 

                    current_div = div

                    console.log("current_index",current_index,"cuurent obj",current_obj,"current div=",current_div)
             
                    document.getElementById("d4").innerHTML ="SAVE"


                   })
                 
              document.getElementById("d1").value =""

           }    
             
             // save contacts function call .  
                       function save_contacts() 
                        {     
                       current_obj.fullname = document.getElementById("d1").value 


                      console.log("Contacts = ",Contacts)  

                      current_div.innerHTML = "full name :"+current_obj.fullname+"<br><br>"

                      // insie save newly created edit button  is appende to current div .
                      var new_button = document.createElement("button")
                      new_button.innerHTML = "edit"
                      current_div.appendChild(new_button)  

                      document.getElementById("d1").value =""


                      document.getElementById("d4").innerHTML = "Add Contact"  


                      var saved_index = current_index 
                      var saved_object = current_obj 
                      var saved_div = current_div


                    console.log("global index =",current_index,"global object",current_obj)

                      new_button.addEventListener("click",function()
                    { 
                      document.getElementById("d1").value = saved_object.fullname

                      console.log("saved_index =",saved_index,"saved object",saved_object,"saved_div",saved_div) 

                      current_index = saved_index 
                      current_obj = saved_object 
                      current_div= saved_div


                    document.getElementById("d4").innerHTML = "SAVE"


                          
                    })


                

                        }
             


             




         
           
        </script>
    </body>
</html>
