<html> 
    <head> 
         <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
        <style> 
        .div
        {
            border:2px solid ;
            width: 250px;
            padding:6px;
            margin:5px ;
            box-sizing: border-box;
        } 
        </style>
    </head>
    <body>  
        <form onsubmit=bb(event)>
            <label>Full Name :</label>
            <input type="text" id="d1"/> <br><br>
            
            
            <!-- The Three Button Types
There are three possible values for type on a button:

Type	What it does
submit	(Default) Submits the form → reloads page or sends data to server
button	Does nothing on its own. Just sits there, waiting for JavaScript.
reset	Clears all inputs in the form back to their original values -->
        <button  onclick=choose() id="d4">Add Contact</button>
        </form>

         <i class="bi bi-sort-alpha-down" onclick="sort()"></i>&nbsp&nbsp&nbsp&nbsp&nbsp&nbsp&nbsp

         <input type="search" placeholder="Search a contact"/>
       

       
        <script> 
  
           function bb(e)
               {
                 e.preventDefault()
               }
             function choose()
             {
               if(document.getElementById("d4").innerHTML === "Add Contact")
                  {
                display_contacts()
                  } 
                   else 
                   {
                    save_contacts()
                   }
              }
          
               var Contacts = [] 

               var global_index = -1 
               var global_obj = null 
               var global_div = null
           
            // display contacts function call .
           function display_contacts()
           {
               var current_obj ={
                             fullname:"",
                             number:'',
                             email:''
                                 }  
               current_obj.fullname = document.getElementById('d1').value 
               Contacts.push(current_obj)
               console.log("contacts =",Contacts)

               var current_div = document.createElement("div")
               current_div.className = "div"
               current_div.innerHTML ="Full Name :"+ current_obj.fullname+"<br><br>"
               document.body.appendChild(current_div) 

               var ed_button = document.createElement("button")
               ed_button.innerHTML ="EDIT"
               current_div.appendChild(ed_button)
               ed_button.addEventListener("click",function(){

                 document.getElementById("d1").value = current_obj.fullname 

                var current_index = Contacts.indexOf(current_obj)  

                console.log("current object =",current_obj,"current_inedx",current_index,"current_div",current_div)  
       
                // here i am ssingif current index and object and div to global because to acess in save function to edit 
                global_index = current_index 
                global_obj = current_obj 
                global_div  = current_div

                document.getElementById("d4").innerHTML ="SAVE"

               }) 

               var del_button = document.createElement("button")
               del_button.innerHTML = "DELETE"
               current_div.appendChild(del_button)
               del_button.addEventListener("click", function()
            { 
               var real_index = Contacts.indexOf(current_obj) 
               Contacts.splice(real_index,1)
               console.log("after removing contacts array is",Contacts) 
               current_div.remove()

            })

               document.getElementById("d1").value = ""
                
           }    
             
             // save contacts function call .  
              function save_contacts() 
                        {     
                   
                       global_obj.fullname = document.getElementById("d1").value  

                       global_div.innerHTML = "FULL NAME:"+global_obj.fullname+"<br><br>"


                       console.log("globalindex =",global_index,"global object =",global_obj,"global div =",global_div)


                       console.log("finally contacts array is = ",Contacts) 

                       document.getElementById("d4").innerHTML ="Add Contact"

                       // i am stoing global index global object and global div to re use in newly created edit button  
                       var stored_index = global_index 
                       var stored_obj = global_obj 
                       var stored_div  = global_div

                       //NEW EDIT BUTTON 

                       var ed_button = document.createElement("button") 
                       ed_button.innerHTML ="edit" 
                       global_div.appendChild(ed_button)
                 
                       ed_button.addEventListener("click",function(){
                         
                        document.getElementById("d1").value = stored_obj.fullname

                        global_index = stored_index 

                        global_obj = stored_obj 

                        global_div = stored_div 

                        document.getElementById("d4").innerHTML = "SAVE"

                       }) 
                       //new del button 

                       var del_button = document.createElement("button")
                       del_button.innerHTML ="delete"
                       global_div.appendChild(del_button)
                       del_button.addEventListener("click", function()
                    {
                      var real_index = Contacts.indexOf(stored_obj)
                      Contacts.splice(real_index,1)
                      stored_div.remove()

                      console.log('after removing array is',Contacts)

                    })
            
                      }
             

             function sort()
             { 
                Contacts.sort(function(a,b){
                    return a.fullname.localeCompare(b.fullname)
                })
                     
              document.querySelectorAll(".div").forEach(function(a){
                a.remove()
                })
              
                Contacts.forEach(function(a){

                var div =  document.createElement("div")
                div.className = "div"
                div.innerHTML = "FullName:"+a.fullname+"<br>"
                document.body.appendChild(div) 


                var button = document.createElement("button")
                button.innerHTML = "EDIT"
                div.appendChild(button)
                button.addEventListener("click",function(){
                    document.getElementById("d1").value = a.fullname 

                })

                })
                

             }




         
           
        </script>
    </body>
</html>
