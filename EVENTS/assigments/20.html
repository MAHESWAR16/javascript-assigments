    <head> 
        <style>

    <body> 


        <form onsubmit="abc(event)" align="center" id="ff">

            <input type="text" id="b1" />  <br> <br> 
            <label>Mail id</label>

            <label>Number</label>
            <input type ="number" id="b3"/><br> <br>
             <button onclick="add()" id="s1">ADD CONTACT</button>
        </form>

        

       <script>
            function abc(e) 
           {
               e.preventDefault()
           } 
             
         

             
           function add() 
           {
             
           
            alert("hello")

                 var div = document.createElement("div") 
                 div.className = "div" 
                 document.body.appendChild(div) 

                 var name = document.createElement("p")
                 name.innerHTML = "Fullname:"+ document.getElementById("b1").value
                 div.appendChild(name)
                 document.getElementById("b1").value =""

                 var number = document.createElement("p")
                 number.innerHTML ="Number:"+document.getElementById("b3").value
                 div.appendChild(number)
                 document.getElementById("b3").value =""

                   

                   var save = document.createElement('button')
                 save.innerHTML = 'SAVE'
                  
  

                 

                 var edt_button = document.createElement("button") 
                 edt_button.innerHTML ="EDIT" 
                 div.appendChild(edt_button) 
                 edt_button.addEventListener
                 ("click", function(){
                    document.getElementById("b1").value = name.innerHTML.replace("Fullname:","")
                    document.getElementById("b2").value = email.innerHTML.replace("Email:","")
                    document.getElementById("b3").value = number.innerHTML.replace("Number:","")
                    document.getElementById("s1").style.visibility ="hidden"
                    save.style.visibility ="visible" 
                    div.appendChild(save)

                 }
                 )
                    
                 save.addEventListener("click", function()
                 {  
                    name.innerHTML = "Fullname:"+ document.getElementById("b1").value
                    document.getElementById("b1").value =""
                    email.innerHTML = 'Email:'+ document.getElementById("b2").value
                    document.getElementById("b2").value =""
                    number.innerHTML ="Number:"+document.getElementById("b3").value
                    document.getElementById("b3").value =""
                    save.style.visibility = "hidden"
                    document.getElementById("s1").style.visibility ="visible"
                 }
                )
                 
                //   // DELETE BUTTON 
                   
                var del_button = document.createElement("button")
                del_button.innerHTML = "Delete" 
                del_button.addEventListener("click", function()
                {

                console.log("result =" , result)
                if(result)

                    div.remove()
                }
                }
            
            
            )
 
 
                  div.appendChild(del_button)
