<html> 
    <head> 
        <style> 
        form{
            text-align: center;
        } 
        .rf 
        {
            border: 2px solid;
            width: 180px;
            display: inline-block;
        }

        </style>
    </head>
    <body> 
        
        <form onsubmit="ff(event)">

            <label>Enter Name :</label>
            <input type = "text" id="d1"/> <br> <br>

            <label>Number :</label>
            <input type ="number" id="d2"/> <br> <br>

            <Label>Email :</Label>
            <input type="email" id="d3"/> <br> <br>

            <button onclick="abc(event)">Submit</button>

        </form>
        
      
          
        <script>

            var array = []
        function ff(e) 
        {
          
            e.preventDefault()
        }
        function abc(e)
        { 
            var store_name = document.getElementById("d1").value 
            var store_Number = document.getElementById("d2").value
            var store_Email = document.getElementById("d3").value
             
            var div = document.createElement("div")
             
            div.className = "rf" 
            
             
            var name = document.createElement("p") 
            name.innerHTML = "Name :" + store_name
            div.appendChild(name) 
         

            var number = document.createElement("p")
            number.innerHTML = "Number :" + store_Number
            div.appendChild(number) 
            
            var email = document.createElement("p")
            email.innerHTML = "Email :" + store_Email
            div.appendChild(email) 

             console.log('e=', e)

            document.getElementById("d1").value = ""
            document.getElementById("d2").value = ""
            document.getElementById("d3").value = ""

            var ed_button = document.createElement("button")
            ed_button.innerHTML ="EDIT"
            ed_button.addEventListener("click", function(e) { 

                console.log(this.innerHTML)

                //e.target.innerHtml or this both are same . 

             
                 
                if(e.target.innerHTML === "EDIT")
            { 
                document.getElementById("d1").value = store_name
                document.getElementById("d2").value = store_Number
                document.getElementById("d3").value = store_Email
                this.innerHTML = 'SAVE'
            }
            else 
            { 

            console.log(e.target.innerHTML) 
            name.innerHTML ="NAME :" + document.getElementById("d1").value 
            number.innerHTML ="Number :" + document.getElementById("d2").value 
            email.innerHTML ="Email:"+ document.getElementById("d3").value
            e.target.innerHTML = 'EDIT'  
            document.getElementById("d1").value = ""
            document.getElementById("d2").value = ""
            document.getElementById("d3").value = ""

            }
    
            })
              
            div.appendChild(ed_button)
                
            var del_button = document.createElement("button")
            del_button.innerHTML = "Delete" 
            del_button.addEventListener("click", function() { 
               div.remove()
            })
              
           div.appendChild(del_button) 
         
           array.push("div")
           
           document.body.appendChild(div)


        } 
    
        </script>
    </body>
</html>
