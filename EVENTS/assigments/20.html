<html> 
    <head> 
        <style> 

        .d1 
        { 
            border:2px solid ;
            width:40% ;

        </head> 

        <body> 



        <form onsubmit="abc(event)" id="ss"> 
            <label> Full Name : </label> 
            <input type="text" name="Full Name" id="b1"/> <br> <br>
            <label>Emal:</label>
            <input type="email" name="Email" id="b2"/> <br><br> 
            <label>Number : </label> 
            <input type="number" name="Number" id="b3"/> <br> <br>
            <button onclick="add()" id="b4">Add Contacts</button>
        </form> 
                 
         

            <script> 
               function abc(e)
               { 
                 e.preventDefault()
               }
                   
               function add()
               { 

                alert("hello") 

                var div = document.createElement("div") 
                 
                div.className ="d1" 

                var Fullname = document.createElement("p") 
                Fullname.innerHTML = "FULL NAME :"+ document.getElementById("b1").value 

                div.appendChild(Fullname) 

                var Email= document.createElement("p") 
                Email.innerHTML = 'Email :' +  document.getElementById("b2").value 
                div.appendChild(Email) 

                var Number = document.createElement("p") 
                Number.innerHTML = 'Number :' + document.getElementById("b3").value 
                div.appendChild(Number)
              
                var button = document.createElement("button") 
                button.innerHTML = "EDIT"  
                button.addEventListener("click", function ()
                { 
                      alert("you have clicked on edit button ") 

                      
                      document.getElementById("b1").value ="" 
                      document.getElementById("b1").value = Fullname.innerHTML.replace("FULL NAME :","")


                      document.getElementById("b4").remove() 
                     
                      //SAVE
                      var s_button = document.createElement("button") 
                      s_button.innerHTML = "SAVE" 
                       s_button.addEventListener("click", function() 
                    { 
                       alert(" you have clicked save button ")
                       Fullname.innerHTML = "FULL NAME :" +document.getElementById("b1").value 
                        document.getElementById("b1").value =""

                          s_button.remove() 

                           // new add contact buton 
                          var a_button = document.createElement("button")
                          a_button.innerHTML = "Add Conatcts" 
                          document.getElementById("ss").appendChild(a_button)
                          a_button.addEventListener("click", function() 
                           
                          { 
                            add()
                          }
                        
                        )


                    })
                      document.getElementById("ss").append(s_button)




                      


                }
             
            )


                
                
                
                
               div.appendChild(button)
               document.body.appendChild(div)
               }


            </script>
