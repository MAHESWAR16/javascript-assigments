<html> 
    <head>
        <style> 
         
         .div
         { 
             border:2px solid ; 
             display: inline-block;
             margin: 5px;

             box-sizing: border-box;

         }


        </style>


    </head> 


    <body> 


    


        <form onsubmit="abc(event)">
            <input type="text" placeholder="enter your name" id="d1"><br>
            <input type="number" placeholder="number" id="d2"><br> 
            <input type ="email" placeholder="email" id="d3"><br>
            <input type="url" placeholder="enter image" id="d4 "><br>
            <button onclick="def()">submit</button>
        </form>

        
        

        <script> 

        function abc()
        { 
            // alert(" submit hello")
            event.preventDefault()

            
        } 
         
       

        function def()
        { 
            alert("button hello")  
            


                 


            

            var newdiv = document.createElement("div")
            newdiv.className = "div" 
          

            var nameh1 = document.createElement("h1")
            nameh1.innerText = "name:"
           

             var name = document.createElement("span")
            name.innerHTML = document.getElementById("d1").value

            nameh1.appendChild(name) 
            newdiv.appendChild(nameh1) 

           


            var numberh1 = document.createElement("h1")
            numberh1.innerText = "Number :" 

            var number = document.createElement("span") 
            number.innerHTML = document.getElementById("d2").value 
            
            numberh1.appendChild(number) 
            newdiv.appendChild(numberh1)

             


            var emailh1 = document.createElement("h1") 
            emailh1.innerText = "email id :" 

            var email = document.createElement("span") 
            email.innerHTML = document.getElementById("d3").value

            emailh1.appendChild(email)
            newdiv.appendChild(emailh1)











            document.body.appendChild(newdiv) 

         
        }

                

                  


        </script>
    </body>
</html>
