<html> 
    <head>
        <style> 
         
         .div
         { 
             border:2px solid ; 
             display: inline-block;
             margin: 5px;
             

             box-sizing: border-box;
         }
        .img 
         { 
            width: 50px;
            height: 45px;
            border-radius:30px ; 
            
            display: block;
    margin: 0 auto;
            
         }


        </style>


    </head> 


    <body> 
        <form onsubmit="abc(event)">
            <input type="text" placeholder="enter your name" id="d1"><br>
            <input type="number" placeholder="number" id="d2"><br> 
            <input type ="email" placeholder="email" id="d3"><br>
            <input type="url" placeholder="enter image" id="d4 "><br>
            <button onclick="def()">submit</button>
        </form>

        <script> 
        function abc()
        { 
            // alert(" submit hello")
            event.preventDefault()
        } 
         
        function def()
        { 
            alert("button hello")  

            var newdiv = document.createElement("div")
            newdiv.className = "div" 
          

            var img = document.createElement("img")
            img.src = "https://m.media-amazon.com/images/M/MV5BM2JlNDMzZmYtNDg0YS00YTBlLTgzNjUtYjRiMGM4NWUzZGE4XkEyXkFqcGc@._V1_.jpg" 

            img.className = "img"
            newdiv.appendChild(img)


            var nameh3 = document.createElement("h3")
            nameh3.innerText = "name:"
           

             var name = document.createElement("span")
            name.innerHTML = document.getElementById("d1").value

            nameh3.appendChild(name) 
            newdiv.appendChild(nameh3) 

            var numberh3 = document.createElement("h3")
            numberh3.innerText = "Number :" 

            var number = document.createElement("span") 
            number.innerHTML = document.getElementById("d2").value 
            
            numberh3.appendChild(number) 
            newdiv.appendChild(numberh3)

            var emailh3 = document.createElement("h3") 
            emailh3.innerText = "email id :" 

            var email = document.createElement("span") 
            email.innerHTML = document.getElementById("d3").value

            emailh3.appendChild(email)
            newdiv.appendChild(emailh3)

            document.body.appendChild(newdiv) 
        }

                

                  


        </script>
    </body>
</html>
